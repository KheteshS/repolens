
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: repolens
      POSTGRES_DB: repolens
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis: 
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: